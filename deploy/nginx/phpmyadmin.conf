# Vhost dedicado ao phpMyAdmin (acesso via SSO gerado pelo Painel) —
# porta própria, nunca 80/443 (essas ficam para os vhosts das contas de
# hospedagem), pra não colidir com o vhost "catch-all" de nenhum
# domínio de cliente. Reaproveita o mesmo certificado self-signed do
# Agent (deploy/README.md seção 4) só pra confidencialidade em
# trânsito — o link de acesso já é de uso único e curta validade.

server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    server_name _;

    ssl_certificate     /etc/pki/arcnp-agent/agent.crt;
    ssl_certificate_key /etc/pki/arcnp-agent/agent.key;

    root /opt/phpmyadmin;
    index index.php;

    access_log /var/log/nginx/phpmyadmin-access.log;
    error_log  /var/log/nginx/phpmyadmin-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm-pma/pma.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }
}
