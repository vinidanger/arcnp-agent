# Vhost de gerenciamento do Agent — porta dedicada, nunca 80/443
# (essas ficam para os vhosts das contas de hospedagem). Acesso restrito
# por firewall só ao IP do Painel (ver deploy/README.md).

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    # Certificado próprio do Agent (self-signed ou Let's Encrypt dedicado).
    # A assinatura HMAC em cada requisição já garante autenticidade/integridade;
    # o TLS aqui cobre confidencialidade em trânsito.
    ssl_certificate     /etc/pki/arcnp-agent/agent.crt;
    ssl_certificate_key /etc/pki/arcnp-agent/agent.key;

    root /opt/arcnp-agent/public;
    index index.php;

    access_log /var/log/nginx/arcnp-agent-access.log;
    error_log  /var/log/nginx/arcnp-agent-error.log;

    # Padrão do nginx é 1m — muito abaixo do limite configurável em
    # Admin > Configurações no Painel (chave "max_upload_mb"). Sem
    # isso, upload de arquivo maior que 1MB é rejeitado aqui antes de
    # chegar no PHP-FPM (com folga sobre o upload_max_filesize/
    # post_max_size do pool, ver deploy/php-fpm/arcnp-agent.conf).
    client_max_body_size 300m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm/arcnp-agent.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
