# Vhost dedicado ao Roundcube (webmail) — porta própria, nunca 80/443
# (essas ficam para os vhosts das contas de hospedagem), mesma lógica
# do phpmyadmin.conf. Reaproveita o mesmo certificado self-signed do
# Agent só pra confidencialidade em trânsito — o link de acesso via
# Painel já é de token de uso único e curta validade; login manual
# direto na tela do Roundcube usa a senha real da caixa via IMAPS.

server {
    listen 8445 ssl;
    listen [::]:8445 ssl;
    server_name _;

    ssl_certificate     /etc/pki/arcnp-agent/agent.crt;
    ssl_certificate_key /etc/pki/arcnp-agent/agent.key;

    root /opt/roundcube/public_html;
    index index.php;

    access_log /var/log/nginx/roundcube-access.log;
    error_log  /var/log/nginx/roundcube-error.log;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php-fpm-roundcube/roundcube.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/(SQL|bin|config|logs|temp|tests|vendor)/ {
        deny all;
    }
}
