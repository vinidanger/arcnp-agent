; Pool único (não é por conta, Roundcube é uma instância compartilhada
; por servidor) — copiar para /etc/php-fpm-roundcube.d/roundcube.conf.

[roundcube]
user = roundcube
group = roundcube
listen = /run/php-fpm-roundcube/roundcube.sock
listen.owner = nginx
listen.group = nginx
pm = ondemand
pm.max_children = 10

php_admin_value[open_basedir] = /opt/roundcube:/var/lib/roundcube-sso:/tmp
php_admin_flag[log_errors] = on
