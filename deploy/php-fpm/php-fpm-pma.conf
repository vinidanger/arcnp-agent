; Config raiz de uma instância php-fpm SEPARADA, exclusiva pro
; phpMyAdmin. Isolada do php-fpm.service (Painel/Agent) e do
; php-fpm-hosting (contas de cliente) por fronteira de confiança: essa
; pool tem acesso de sessão a QUALQUER banco autenticado via SSO, então
; roda com usuário próprio, sem nenhum outro processo compartilhando o
; mesmo espaço.

[global]
pid = /run/php-fpm-pma.pid
error_log = /var/log/php-fpm/pma-error.log

include=/etc/php-fpm-pma.d/*.conf
