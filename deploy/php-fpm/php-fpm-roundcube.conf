; Config raiz de uma instância php-fpm SEPARADA, exclusiva pro
; Roundcube — mesma lógica de isolamento do php-fpm-pma.conf: essa
; pool tem acesso à sessão de e-mail de qualquer caixa logada, então
; roda com usuário próprio, sem nenhum outro processo compartilhando o
; mesmo espaço.

[global]
pid = /run/php-fpm-roundcube.pid
error_log = /var/log/php-fpm/roundcube-error.log

include=/etc/php-fpm-roundcube.d/*.conf
