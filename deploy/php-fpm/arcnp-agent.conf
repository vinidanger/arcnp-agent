; Pool dedicado do Agent, isolado dos pools das contas de hospedagem.
; Roda como usuário sem privilégios — o Agent nunca executa como root
; diretamente. Comandos que exigem root passam por sudo, autorizado
; apenas para binários fixos listados em /etc/sudoers.d/arcnp-agent
; (ver deploy/sudoers/arcnp-agent).

[arcnp-agent]
user = arcnpagent
group = arcnpagent

listen = /run/php-fpm/arcnp-agent.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s

php_admin_value[error_log] = /var/log/php-fpm/arcnp-agent-error.log
php_admin_flag[log_errors] = on

; O Agent nunca recebe upload de arquivos arbitrários do Painel nesta fase.
php_admin_value[upload_max_filesize] = 8M
php_admin_value[post_max_size] = 8M
