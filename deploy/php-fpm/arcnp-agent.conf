; Pool dedicado do Agent, isolado dos pools das contas de hospedagem.
; Roda como usuário sem privilégios — o Agent nunca executa como root
; diretamente. Comandos que exigem root passam por sudo, autorizado
; apenas para binários fixos listados em /etc/sudoers.d/arcnp-agent
; (ver deploy/sudoers/arcnp-agent).

[arcnp-agent]
user = arcnpagent
group = arcnpagent

listen = /run/php-fpm/arcnp-agent.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s

php_admin_value[error_log] = /var/log/php-fpm/arcnp-agent-error.log
php_admin_flag[log_errors] = on

; Upload de arquivo do gerenciador de arquivos (POST /api/files/{username}/upload,
; corpo binário bruto) relaia pelo Agent — precisa comportar pelo menos o
; limite configurável em Admin > Configurações no Painel (chave
; "max_upload_mb", tabela settings), com folga.
php_admin_value[upload_max_filesize] = 300M
php_admin_value[post_max_size] = 300M

; O corpo inteiro do upload passa por $request->getContent() no
; middleware de verificação de assinatura (VerifySignedRequest, precisa
; ler tudo pra recalcular o HMAC) e de novo em FileUploadController —
; sem isso, memory_limit padrão (128M) estoura bem antes de chegar no
; teto de 300M acima.
php_admin_value[memory_limit] = 512M
