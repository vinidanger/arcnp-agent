; Config raiz de uma instância php-fpm SEPARADA, exclusiva pras contas
; de hospedagem provisionadas pelo Agent. Existe separada do
; php-fpm.service (que atende Painel + Agent) por um motivo específico:
; toda vez que uma conta é criada/removida, o Agent precisa recarregar
; o php-fpm pra ativar o pool novo — e um reload derruba momentaneamente
; TODOS os pools daquele serviço. Se fosse o mesmo serviço do Painel,
; cada conta nova causaria uma interrupção breve no próprio Painel
; (que roda no mesmo host). Com serviços separados, o reload de uma
; conta de cliente nunca afeta o Painel nem o Agent.

[global]
pid = /run/php-fpm-hosting.pid
error_log = /var/log/php-fpm/hosting-error.log

include=/etc/php-fpm-hosting.d/*.conf
