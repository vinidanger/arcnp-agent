; Pool único (não é por conta, phpMyAdmin é uma instância compartilhada
; por servidor) — copiar para /etc/php-fpm-pma.d/pma.conf.
; session.save_path é o que permite o script-ponte (sso-login.php) e o
; próprio phpMyAdmin, rodando na mesma pool, compartilharem a sessão
; "SignonSession" que o auth_type=signon exige.

[pma]
user = pma
group = pma
listen = /run/php-fpm-pma/pma.sock
listen.owner = nginx
listen.group = nginx
pm = ondemand
pm.max_children = 5

php_admin_value[open_basedir] = /opt/phpmyadmin:/var/lib/pma-sso:/tmp
php_admin_value[session.save_path] = /var/lib/pma-sso/sessions
php_admin_flag[log_errors] = on
